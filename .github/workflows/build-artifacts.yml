name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      wine_version:
        description: "Select the wine version to pin the build to"
        required: true
        default: ''
        type: string
      lug_rev:
        description: "Select the lug revision"
        required: true
        default: '1'
        type: string
  workflow_call:
    inputs:
      wine_version:
        description: "Select the wine version to pin the build to"
        required: true
        default: ''
        type: string
      lug_rev:
        description: "Select the lug revision"
        required: true
        default: '1'
        type: string
env:
  WINE_VERSION: ${{ inputs.wine_version || github.event.inputs.wine_version }}
  LUG_REV: ${{ inputs.lug_rev || github.event.inputs.lug_rev }}
jobs:
  build_vkd3d_proton:
    uses: "./.github/workflows/build-vkd3d-proton.yml"
  build:
    needs: build_vkd3d_proton
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [default, staging-default]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Download vkd3d-proton artifact
        uses: actions/download-artifact@v8
        with:
          name: vkd3d-proton-build
          path: ./vkd3d-proton-build
      - name: Extract vkd3d-proton artifact
        shell: bash {0}
        run: |
          if [ -f ./vkd3d-proton-build/vkd3d-proton.tar.gz ]; then
            tar -xzf ./vkd3d-proton-build/vkd3d-proton.tar.gz --one-top-level
          else
            echo "No vkd3d artifact found; continuing without it"
          fi
      - name: Compilation
        shell: bash {0}
        run: |
          echo "$WINE_VERSION" "$LUG_REV"
          ./build-lug-wine-docker.sh --preset "${{ matrix.preset }}" --version "$WINE_VERSION" --revision "$LUG_REV"
      - name: Upload Archive
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.preset }}-build"
          path: ./output
